DWAPlannerROS:
  odom_topic: /ground/odom
  holonomic_robot: false
  max_vel_x: 0.40
  min_vel_x: -0.20
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.40
  min_vel_trans: 0.0
  max_vel_theta: 1.0
  min_vel_theta: 0.4
  acc_lim_x: 0.60
  acc_lim_y: 0.0
  acc_lim_theta: 1.20
  yaw_goal_tolerance: 0.025
  xy_goal_tolerance: 0.025
  latch_xy_goal_tolerance: true
  sim_time: 1.5
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  vx_samples: 10
  vy_samples: 1
  vth_samples: 30
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.01
  # The pick approach ends with a short reverse move and an in-place turn.
  # A forward scoring point makes DWA orbit this nearby goal.
  forward_point_distance: 0.0
