robot_base_frame: ground/base_link
transform_tolerance: 0.3
footprint: [[-0.50, -0.37], [-0.50, 0.37], [0.50, 0.37], [0.50, -0.37]]
footprint_padding: 0.02
obstacle_layer:
  observation_sources: scan
  scan:
    topic: /ground/scan
    sensor_frame: ground/lidar_2d_link
    data_type: LaserScan
    marking: true
    clearing: true
    inf_is_valid: true
    obstacle_range: 5.5
    raytrace_range: 6.0
