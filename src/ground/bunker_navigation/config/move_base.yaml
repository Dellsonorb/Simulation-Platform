base_global_planner: navfn/NavfnROS
base_local_planner: dwa_local_planner/DWAPlannerROS
controller_frequency: 15.0
controller_patience: 8.0
# DWA 1.17.3 clears the XY latch on every setPlan, even for an unchanged
# endpoint. For point-goal execution replan on a new goal/control failure,
# not periodically during final stop-and-rotate. Local collision checking and
# costmap updates remain active at their normal rates.
planner_frequency: 0.0
planner_patience: 5.0
shutdown_costmaps: false
recovery_behavior_enabled: false
clearing_rotation_allowed: true
oscillation_timeout: 0.0
oscillation_distance: 0.05
