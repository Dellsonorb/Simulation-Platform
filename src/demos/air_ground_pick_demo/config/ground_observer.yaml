color_topic: /ground/d435/color/image_raw
depth_topic: /ground/d435/depth/image_raw
color_info_topic: /ground/d435/color/camera_info
depth_info_topic: /ground/d435/depth/camera_info
camera_optical_frame: ground/d435_color_optical_frame
target_frame: map
output_topic: /ground_observer/target_pose
status_topic: /ground_observer/status
target_height: 0.115
top_surface_tolerance: 0.015
# Opt-in Ground geometry: 90% span limits missing-support center uncertainty
# to 12 mm along / 2.65 mm across the known top, below the 20 mm TCP tolerance.
target_top_size: [0.240, 0.053]
minimum_top_span_fraction: 0.90
maximum_top_tilt_degrees: 15.0
# Raw measured surface median for camera aiming; not an accepted cuboid pose.
surface_cue_topic: /ground_observer/surface_cue
min_depth: 0.12
max_depth: 2.5
min_pixels: 40
minimum_points: 40
ambiguity_ratio: 0.65
stable_frames: 4
max_position_spread: 0.05
max_yaw_spread: 0.20
sync_queue_size: 10
sync_slop: 0.06
tf_timeout: 0.25
max_observation_age: 1.0
max_future_skew: 0.1
