joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 100

arm_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  constraints:
    goal_time: 2.0
    stopped_velocity_tolerance: 0.05
    shoulder_pan_joint: {goal: 0.05}
    shoulder_lift_joint: {goal: 0.05}
    elbow_joint: {goal: 0.05}
    wrist_1_joint: {goal: 0.05}
    wrist_2_joint: {goal: 0.05}
    wrist_3_joint: {goal: 0.05}
  stop_trajectory_duration: 0.5
  state_publish_rate: 100
  action_monitor_rate: 20

gripper_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - left_outer_knuckle_joint
  constraints:
    goal_time: 1.0
    stopped_velocity_tolerance: 0.05
    left_outer_knuckle_joint: {trajectory: 0.08, goal: 0.05}
  stop_trajectory_duration: 0.3
  state_publish_rate: 100
  action_monitor_rate: 20

gazebo_ros_control:
  pid_gains:
    shoulder_pan_joint: {p: 5000.0, i: 1.0, d: 200.0, i_clamp: 1.0}
    shoulder_lift_joint: {p: 12000.0, i: 1.0, d: 200.0, i_clamp: 1.0}
    elbow_joint: {p: 3000.0, i: 1.0, d: 20.0, i_clamp: 1.0}
    wrist_1_joint: {p: 1000.0, i: 1.0, d: 1.0, i_clamp: 1.0}
    wrist_2_joint: {p: 500.0, i: 1.0, d: 1.0, i_clamp: 1.0}
    wrist_3_joint: {p: 100.0, i: 0.0, d: 0.1, i_clamp: 1.0}
    left_outer_knuckle_joint: {p: 10.0, i: 1.0, d: 0.1, i_clamp: 1.0}
    right_outer_knuckle_joint: {p: 20.0, i: 1.0, d: 0.1, i_clamp: 1.0}
